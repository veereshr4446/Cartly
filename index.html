const MASCOT='<svg viewBox="0 0 48 48"><path d="M9 20L7 5l12 8zM39 20l2-15-12 8z" fill="#98002e"/><path d="M11 17l-1-8 6 4zM37 17l1-8-6 4z" fill="#f6a5b8"/><ellipse cx="24" cy="28" rx="18" ry="16" fill="#fff"/><ellipse cx="24" cy="28" rx="18" ry="16" fill="none" stroke="#98002e" stroke-width="2.4"/><ellipse cx="17" cy="26" rx="2.6" ry="3.4" fill="#2d0a12"/><ellipse cx="31" cy="26" rx="2.6" ry="3.4" fill="#2d0a12"/><circle cx="18" cy="24.8" r=".9" fill="#fff"/><circle cx="32" cy="24.8" r=".9" fill="#fff"/><ellipse cx="11.5" cy="32" rx="3.4" ry="2.2" fill="#f6a5b8" opacity=".85"/><ellipse cx="36.5" cy="32" rx="3.4" ry="2.2" fill="#f6a5b8" opacity=".85"/><path d="M20.5 32q3.5 4 7 0" fill="none" stroke="#98002e" stroke-width="2" stroke-linecap="round"/><path d="M20 4q4-3 8 0" fill="none" stroke="#98002e" stroke-width="2" stroke-linecap="round"/></svg>';
$('#fm').innerHTML=MASCOT;$('.av').innerHTML=MASCOT;
const fab=$('#fab'),chat=$('#chat'),chHd=chat.querySelector('.ch'),EDGE=8,mob=()=>innerWidth<=700,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let fpos=null,dragged=false;
try{fpos=JSON.parse(localStorage.getItem('cartly_fab')||'null')}catch(e){}
function placeFab(x,y){const w=fab.offsetWidth,h=fab.offsetHeight;x=cl(x,EDGE,innerWidth-w-EDGE);y=cl(y,EDGE,innerHeight-h-EDGE);fab.style.left=x+'px';fab.style.top=y+'px';fab.style.right='auto';fab.style.bottom='auto';fpos={x,y}}
function initFab(){fpos?placeFab(fpos.x,fpos.y):placeFab(innerWidth-fab.offsetWidth-20,innerHeight-fab.offsetHeight-22)}
function setChat(x,y){const w=chat.offsetWidth,h=chat.offsetHeight;chat.style.left=cl(x,EDGE,innerWidth-w-EDGE)+'px';chat.style.top=cl(y,EDGE,innerHeight-h-EDGE)+'px';chat.style.right='auto';chat.style.bottom='auto'}
function openChat(){chat.classList.add('o');if(mob()){['left','top','right','bottom'].forEach(k=>chat.style[k]='')}else{const f=fab.getBoundingClientRect(),w=chat.offsetWidth,h=chat.offsetHeight;setChat(f.left+f.width/2>innerWidth/2?f.right-w:f.left,f.top+f.height/2>innerHeight/2?f.top-h-12:f.bottom+12)}setTimeout(()=>$('#q').focus({preventScroll:true}),50)}
function closeChat(){chat.classList.remove('o');if(window.speechSynthesis)speechSynthesis.cancel()}
function makeDraggable(el,handle,move,ok){let d=null;handle.addEventListener('pointerdown',e=>{if(e.button>0||(ok&&!ok(e)))return;const r=el.getBoundingClientRect();d={sx:e.clientX,sy:e.clientY,ox:r.left,oy:r.top,m:false};handle.setPointerCapture(e.pointerId)});
handle.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.sx,dy=e.clientY-d.sy;if(!d.m&&Math.hypot(dx,dy)<6)return;d.m=true;handle.classList.add('drg');move(d.ox+dx,d.oy+dy)});
const end=()=>{if(!d)return;if(d.m){dragged=true;setTimeout(()=>dragged=false,80);try{localStorage.setItem('cartly_fab',JSON.stringify(fpos))}catch(e){}}d=null;handle.classList.remove('drg')};
handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end)}
makeDraggable(fab,fab,(x,y)=>placeFab(x,y));
makeDraggable(chat,chHd,setChat,e=>!mob()&&!e.target.closest('button'));
fab.addEventListener('click',()=>{if(dragged)return;openChat()});
$('#cx').addEventListener('click',closeChat);
addEventListener('resize',()=>{initFab();if(chat.classList.contains('o')){if(mob())['left','top','right','bottom'].forEach(k=>chat.style[k]='');else if(chat.style.left)setChat(parseFloat(chat.style.left),parseFloat(chat.style.top))}});
addEventListener('keydown',e=>{if(e.key=='Escape'&&chat.classList.contains('o')&&!$('#md').classList.contains('o'))closeChat()});
initFab();
</script></body></html>
